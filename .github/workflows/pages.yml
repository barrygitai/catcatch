name: Deploy CatchCat to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make the repo public and point Pages at Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${GITHUB_REPOSITORY}"

          # Strangers need a public repo to open the GitHub Pages URL.
          # GITHUB_TOKEN cannot change visibility; a 403 here is expected
          # unless a token with administration permission is used.
          if gh api --method PATCH "repos/${repo}" -f visibility=public; then
            echo "Repository visibility is public."
          else
            echo "Visibility was not changed."
          fi

          if gh api "repos/${repo}/pages" --jq .build_type; then
            gh api --method PUT "repos/${repo}/pages" -f build_type=workflow || echo "Could not set Pages build_type."
          else
            gh api --method POST "repos/${repo}/pages" -f build_type=workflow \
              || echo "Could not create the Pages site. An admin must enable Pages (GitHub Actions) once."
          fi

      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
