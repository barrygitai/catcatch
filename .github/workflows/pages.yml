name: Deploy CatchCat to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish the repository and enable Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          # A phone should be able to open the demo without a GitHub login.
          # The workflow token often lacks administration permission; keep going
          # so the Pages deploy can still be attempted.
          if gh api --method PATCH "repos/${repo}" -f visibility=public --silent; then
            echo "Repository visibility is public."
          else
            echo "Could not change repository visibility with this token."
          fi

          if ! gh api "repos/${repo}/pages" --silent; then
            gh api --method POST "repos/${repo}/pages" \
              -f build_type=workflow \
              -f "source[branch]=main" \
              -f "source[path]=/"
          fi
          gh api --method PUT "repos/${repo}/pages" -f build_type=workflow

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
